name: Contributor rights requests

on:
  schedule:
    # Daily. Requests already withdraw grants from releases the moment they are made; this run
    # deletes the rows, photos and (for account deletion) the auth user.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rights-worker
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: '0.5.5'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: uv sync --frozen --no-dev
      - run: uv run python -m pipeline.rights_worker
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
