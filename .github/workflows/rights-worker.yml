name: Contributor rights requests

on:
  schedule:
    # Hourly. A request already withdraws its grants from releases the moment it is made; this run
    # deletes the rows, photos and (for account deletion) the auth user, removes orphaned objects,
    # and fails if any request is older than 25 days.
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rights-worker
  cancel-in-progress: false

jobs:
  process:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.GSIP_RIGHTS_SCHEDULE_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: '0.5.5'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: uv sync --frozen --no-dev
      # Claims no new request after 20 minutes, well inside the job timeout.
      - run: uv run python -m pipeline.rights_worker --budget-seconds 1200
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}

  # GitHub e-mails only the last person who edited the schedule, so a failure also opens (or
  # comments on) one issue the steward watches. The run log it links holds counts only.
  alert:
    needs: process
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Contributor rights worker is failing'
          body="The rights run failed: ${RUN_URL}. Requests must complete within 30 days; follow the operator checklist in docs/legal/WITHDRAWAL_AND_DELETION.md."
          existing="$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
