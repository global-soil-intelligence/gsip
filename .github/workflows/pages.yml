name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:pages
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_PRIOR_TILES_BASE: ${{ vars.VITE_PRIOR_TILES_BASE }}
          VITE_CAPTURE_LIVE: 'false'
          VITE_LIBRARY_INTAKE_LIVE: 'false'
          VITE_DATASET_URL: ${{ vars.VITE_DATASET_URL }}
          # The deployed gsip-public function; unset until it answers (WP-AGENT-1).
          VITE_GSIP_PUBLIC_API: ${{ vars.VITE_GSIP_PUBLIC_API }}
          VITE_TERMS_URL: ${{ vars.VITE_TERMS_URL }}
          VITE_PRIVACY_URL: ${{ vars.VITE_PRIVACY_URL }}
          VITE_SAMPLING_RULES_URL: ${{ vars.VITE_SAMPLING_RULES_URL }}
      - run: pnpm check:map-budget
      # A legend must never disagree with its tiles: the archives for this palette version must
      # exist and carry its stamp before the map that draws those legends is deployed.
      - run: pnpm check:prior-tiles
        env:
          VITE_PRIOR_TILES_BASE: ${{ vars.VITE_PRIOR_TILES_BASE }}
      - run: pnpm check:site-budget
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
