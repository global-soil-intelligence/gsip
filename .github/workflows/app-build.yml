name: App build

# WP-APP-1: the GSIP phone app. The iOS and Android projects are generated from
# apps/capture-pwa/capacitor.config.ts, given their permissions by scripts/app_permissions.py,
# and built unsigned: an Android debug APK and an iOS simulator build, kept as artifacts.
# WP-APP-2A applies CI versions and Android cloud-backup exclusions, checks the built
# artifacts, and compares repeated builds. Signing/store upload remain owner gates.

on:
  pull_request:
    paths:
      - apps/capture-pwa/**
      - packages/schema/**
      - scripts/app_permissions.py
      - scripts/app_build.py
      - scripts/app_notification_audit.py
      - tests/test_app_build.py
      - tests/test_app_notification_audit.py
      - tests/test_app_permissions.py
      - pnpm-lock.yaml
      - .github/workflows/app-build.yml
  push:
    branches: [main]
    paths:
      - apps/capture-pwa/**
      - packages/schema/**
      - scripts/app_permissions.py
      - scripts/app_build.py
      - scripts/app_notification_audit.py
      - tests/test_app_build.py
      - tests/test_app_notification_audit.py
      - tests/test_app_permissions.py
      - pnpm-lock.yaml
      - .github/workflows/app-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The same public configuration the website's capture app is built with.
  VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
  VITE_CAPTURE_LIVE: 'false'
  VITE_LIBRARY_INTAKE_LIVE: 'false'
  VITE_TERMS_URL: ${{ vars.VITE_TERMS_URL }}
  VITE_PRIVACY_URL: ${{ vars.VITE_PRIVACY_URL }}
  VITE_SAMPLING_RULES_URL: ${{ vars.VITE_SAMPLING_RULES_URL }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile --package-import-method copy
      - run: pnpm --filter @gsip/capture-pwa build:app
      - name: Generate the Android project
        working-directory: apps/capture-pwa
        run: pnpm exec cap add android
      - name: Apply the app's permissions
        run: python scripts/app_permissions.py apply-android apps/capture-pwa/android/app/src/main/AndroidManifest.xml
      - name: Apply CI versions and Android backup rules
        run: python scripts/app_build.py apply-android apps/capture-pwa/android/app "$GITHUB_RUN_NUMBER" apps/capture-pwa/package.json
      - name: Check the app ships no closed SDK
        working-directory: apps/capture-pwa/android
        # bash -eo pipefail: a failed Gradle run fails the step, never passes it with no input.
        shell: bash
        run: |
          {
            ./gradlew --no-daemon -q :app:dependencies --configuration debugRuntimeClasspath
            ./gradlew --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath
          } | python ../../../scripts/app_permissions.py check-dependencies -
      - name: Build the debug APK
        working-directory: apps/capture-pwa/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Check the APK's permissions
        shell: bash
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$aapt2" dump permissions apps/capture-pwa/android/app/build/outputs/apk/debug/app-debug.apk \
            | python scripts/app_permissions.py check-apk -
      - name: Verify the first APK and preserve the comparison input
        shell: bash
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          python scripts/app_build.py check-apk apps/capture-pwa/android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_RUN_NUMBER" apps/capture-pwa/package.json "$aapt2"
          cp apps/capture-pwa/android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/gsip-android-reference.apk"
      - name: Repeat the Android build with the same inputs
        working-directory: apps/capture-pwa/android
        run: ./gradlew --no-daemon assembleDebug --rerun-tasks --no-build-cache
      - name: Check repeated APK policy and record build evidence
        shell: bash
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          apk=apps/capture-pwa/android/app/build/outputs/apk/debug/app-debug.apk
          "$aapt2" dump permissions "$apk" | python scripts/app_permissions.py check-apk -
          python scripts/app_build.py check-apk "$apk" "$GITHUB_RUN_NUMBER" apps/capture-pwa/package.json "$aapt2"
          python scripts/app_build.py receipt "$apk" "$GITHUB_RUN_NUMBER" apps/capture-pwa/package.json "$RUNNER_TEMP/gsip-android-reference.apk" apps/capture-pwa/android/app/build/outputs/apk/debug/gsip-android-build-receipt.json android "$aapt2"
      - name: Audit exact Android runtime and license inputs
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gsip-app2b-evidence/android"
          python -m scripts.app_notification_audit android "$GITHUB_WORKSPACE" "$HOME/.gradle/caches" "$RUNNER_TEMP/gsip-app2b-evidence/android/gsip-android-candidate-native-audit.json" "$HOME/.android/debug.keystore"
      - name: Build the exact APP-2B parent in an isolated checkout
        shell: bash
        run: |
          baseline=d7ed716ed0921381da04f542e90902ede36cb462
          git clone --no-hardlinks --no-checkout https://github.com/global-soil-intelligence/gsip.git "$RUNNER_TEMP/gsip-app2b-parent"
          git -C "$RUNNER_TEMP/gsip-app2b-parent" fetch --no-tags origin "$baseline"
          git -C "$RUNNER_TEMP/gsip-app2b-parent" checkout --detach "$baseline"
          test "$(git -C "$RUNNER_TEMP/gsip-app2b-parent" rev-parse HEAD)" = "$baseline"
          cd "$RUNNER_TEMP/gsip-app2b-parent"
          pnpm install --frozen-lockfile --package-import-method copy
          pnpm --filter @gsip/capture-pwa build:app
          cd apps/capture-pwa
          pnpm exec cap add android
          cd ../..
          python scripts/app_permissions.py apply-android apps/capture-pwa/android/app/src/main/AndroidManifest.xml
          python scripts/app_build.py apply-android apps/capture-pwa/android/app "$GITHUB_RUN_NUMBER" apps/capture-pwa/package.json
          cd apps/capture-pwa/android
          {
            ./gradlew --no-daemon -q :app:dependencies --configuration debugRuntimeClasspath
            ./gradlew --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath
          } | python ../../../scripts/app_permissions.py check-dependencies -
          ./gradlew --no-daemon assembleDebug
          cd ../../..
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          apk=apps/capture-pwa/android/app/build/outputs/apk/debug/app-debug.apk
          "$aapt2" dump permissions "$apk" | python scripts/app_permissions.py check-apk -
          python scripts/app_build.py check-apk "$apk" "$GITHUB_RUN_NUMBER" apps/capture-pwa/package.json "$aapt2"
          cp "$apk" "$RUNNER_TEMP/gsip-android-parent-repeat-reference.apk"
          cd apps/capture-pwa/android
          ./gradlew --no-daemon assembleDebug --rerun-tasks --no-build-cache
          cd ../../..
          "$aapt2" dump permissions "$apk" | python scripts/app_permissions.py check-apk -
          python scripts/app_build.py check-apk "$apk" "$GITHUB_RUN_NUMBER" apps/capture-pwa/package.json "$aapt2"
          cp "$apk" "$RUNNER_TEMP/gsip-app2b-evidence/android/gsip-android-parent.apk"
          python scripts/app_build.py receipt "$apk" "$GITHUB_RUN_NUMBER" apps/capture-pwa/package.json "$RUNNER_TEMP/gsip-android-parent-repeat-reference.apk" "$RUNNER_TEMP/gsip-app2b-evidence/android/gsip-android-parent-build-receipt.json" android "$aapt2"
          cd "$GITHUB_WORKSPACE"
          python -m scripts.app_notification_audit android "$RUNNER_TEMP/gsip-app2b-parent" "$HOME/.gradle/caches" "$RUNNER_TEMP/gsip-app2b-evidence/android/gsip-android-parent-native-audit.json" "$HOME/.android/debug.keystore"
          candidate_commit="$(git rev-parse HEAD)"
          cp "$RUNNER_TEMP/gsip-android-parent-repeat-reference.apk" "$RUNNER_TEMP/gsip-app2b-evidence/android/gsip-android-parent-repeat-reference.apk"
          cp "$RUNNER_TEMP/gsip-android-reference.apk" "$RUNNER_TEMP/gsip-app2b-evidence/android/gsip-android-candidate-repeat-reference.apk"
          python -m scripts.app_notification_audit compare "$RUNNER_TEMP/gsip-app2b-evidence/android/gsip-android-parent.apk" apps/capture-pwa/android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/gsip-app2b-evidence/android/gsip-android-parent-build-receipt.json" apps/capture-pwa/android/app/build/outputs/apk/debug/gsip-android-build-receipt.json "$candidate_commit" "$RUNNER_TEMP/gsip-app2b-evidence/android/gsip-android-feature-comparison.json" "$RUNNER_TEMP/gsip-app2b-evidence/android/gsip-android-parent-native-audit.json" "$RUNNER_TEMP/gsip-app2b-evidence/android/gsip-android-candidate-native-audit.json" "$RUNNER_TEMP/gsip-android-parent-repeat-reference.apk" "$RUNNER_TEMP/gsip-android-reference.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: gsip-capture-android-debug
          path: |
            apps/capture-pwa/android/app/build/outputs/apk/debug/app-debug.apk
            apps/capture-pwa/android/app/build/outputs/apk/debug/gsip-android-build-receipt.json
            ${{ runner.temp }}/gsip-app2b-evidence/android/**
          if-no-files-found: error
          retention-days: 14

  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Use the newest Xcode on the runner
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version
      - run: pnpm install --frozen-lockfile --package-import-method copy
      - run: pnpm --filter @gsip/capture-pwa build:app
      - name: Generate the iOS project
        working-directory: apps/capture-pwa
        run: pnpm exec cap add ios
      - name: Apply the app's permissions
        run: python scripts/app_permissions.py apply-ios apps/capture-pwa/ios/App/App/Info.plist
      - name: Apply CI versions to iOS
        run: python scripts/app_build.py apply-ios apps/capture-pwa/ios/App/App/Info.plist "$GITHUB_RUN_NUMBER" apps/capture-pwa/package.json
      - name: Build for the iOS simulator
        working-directory: apps/capture-pwa/ios/App
        run: >-
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Check the built app's permissions
        run: python scripts/app_permissions.py check-ios apps/capture-pwa/ios/App/build/Build/Products/Debug-iphonesimulator/App.app/Info.plist
      - name: Verify the first iOS build and preserve the comparison input
        run: |
          python scripts/app_build.py check-ios apps/capture-pwa/ios/App/build/Build/Products/Debug-iphonesimulator/App.app/Info.plist "$GITHUB_RUN_NUMBER" apps/capture-pwa/package.json
          ditto -c -k --sequesterRsrc --keepParent apps/capture-pwa/ios/App/build/Build/Products/Debug-iphonesimulator/App.app "$RUNNER_TEMP/gsip-ios-reference.zip"
      - name: Repeat the iOS build with the same inputs
        working-directory: apps/capture-pwa/ios/App
        run: >-
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO clean build
      - name: Check the repeated iOS build
        run: |
          python scripts/app_permissions.py check-ios apps/capture-pwa/ios/App/build/Build/Products/Debug-iphonesimulator/App.app/Info.plist
          python scripts/app_build.py check-ios apps/capture-pwa/ios/App/build/Build/Products/Debug-iphonesimulator/App.app/Info.plist "$GITHUB_RUN_NUMBER" apps/capture-pwa/package.json
      - name: Package the simulator build
        working-directory: apps/capture-pwa/ios/App/build/Build/Products/Debug-iphonesimulator
        run: ditto -c -k --sequesterRsrc --keepParent App.app "$GITHUB_WORKSPACE/gsip-capture-ios-simulator.zip"
      - name: Record iOS build evidence
        run: python scripts/app_build.py receipt gsip-capture-ios-simulator.zip "$GITHUB_RUN_NUMBER" apps/capture-pwa/package.json "$RUNNER_TEMP/gsip-ios-reference.zip" gsip-ios-build-receipt.json ios
      - name: Audit actual iOS native selection and licenses
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gsip-app2b-evidence/ios"
          python -m scripts.app_notification_audit ios "$GITHUB_WORKSPACE" "$RUNNER_TEMP/gsip-app2b-evidence/ios/gsip-ios-candidate-native-audit.json" "$GITHUB_WORKSPACE/gsip-capture-ios-simulator.zip"
      - name: Build the exact iOS parent in an isolated checkout
        shell: bash
        run: |
          baseline=d7ed716ed0921381da04f542e90902ede36cb462
          git clone --no-hardlinks --no-checkout https://github.com/global-soil-intelligence/gsip.git "$RUNNER_TEMP/gsip-app2b-parent"
          git -C "$RUNNER_TEMP/gsip-app2b-parent" fetch --no-tags origin "$baseline"
          git -C "$RUNNER_TEMP/gsip-app2b-parent" checkout --detach "$baseline"
          test "$(git -C "$RUNNER_TEMP/gsip-app2b-parent" rev-parse HEAD)" = "$baseline"
          cd "$RUNNER_TEMP/gsip-app2b-parent"
          pnpm install --frozen-lockfile --package-import-method copy
          pnpm --filter @gsip/capture-pwa build:app
          cd apps/capture-pwa
          pnpm exec cap add ios
          cd ../..
          python scripts/app_permissions.py apply-ios apps/capture-pwa/ios/App/App/Info.plist
          python scripts/app_build.py apply-ios apps/capture-pwa/ios/App/App/Info.plist "$GITHUB_RUN_NUMBER" apps/capture-pwa/package.json
          cd apps/capture-pwa/ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd ../../../..
          python scripts/app_permissions.py check-ios apps/capture-pwa/ios/App/build/Build/Products/Debug-iphonesimulator/App.app/Info.plist
          python scripts/app_build.py check-ios apps/capture-pwa/ios/App/build/Build/Products/Debug-iphonesimulator/App.app/Info.plist "$GITHUB_RUN_NUMBER" apps/capture-pwa/package.json
          ditto -c -k --sequesterRsrc --keepParent apps/capture-pwa/ios/App/build/Build/Products/Debug-iphonesimulator/App.app "$RUNNER_TEMP/gsip-ios-parent-repeat-reference.zip"
          cd apps/capture-pwa/ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO clean build
          cd ../../../..
          python scripts/app_permissions.py check-ios apps/capture-pwa/ios/App/build/Build/Products/Debug-iphonesimulator/App.app/Info.plist
          python scripts/app_build.py check-ios apps/capture-pwa/ios/App/build/Build/Products/Debug-iphonesimulator/App.app/Info.plist "$GITHUB_RUN_NUMBER" apps/capture-pwa/package.json
          ditto -c -k --sequesterRsrc --keepParent apps/capture-pwa/ios/App/build/Build/Products/Debug-iphonesimulator/App.app "$RUNNER_TEMP/gsip-app2b-evidence/ios/gsip-ios-parent.zip"
          python scripts/app_build.py receipt "$RUNNER_TEMP/gsip-app2b-evidence/ios/gsip-ios-parent.zip" "$GITHUB_RUN_NUMBER" apps/capture-pwa/package.json "$RUNNER_TEMP/gsip-ios-parent-repeat-reference.zip" "$RUNNER_TEMP/gsip-app2b-evidence/ios/gsip-ios-parent-build-receipt.json" ios
          cd "$GITHUB_WORKSPACE"
          python -m scripts.app_notification_audit ios "$RUNNER_TEMP/gsip-app2b-parent" "$RUNNER_TEMP/gsip-app2b-evidence/ios/gsip-ios-parent-native-audit.json" "$RUNNER_TEMP/gsip-app2b-evidence/ios/gsip-ios-parent.zip"
          candidate_commit="$(git rev-parse HEAD)"
          cp "$RUNNER_TEMP/gsip-ios-parent-repeat-reference.zip" "$RUNNER_TEMP/gsip-app2b-evidence/ios/gsip-ios-parent-repeat-reference.zip"
          cp "$RUNNER_TEMP/gsip-ios-reference.zip" "$RUNNER_TEMP/gsip-app2b-evidence/ios/gsip-ios-candidate-repeat-reference.zip"
          python -m scripts.app_notification_audit compare "$RUNNER_TEMP/gsip-app2b-evidence/ios/gsip-ios-parent.zip" gsip-capture-ios-simulator.zip "$RUNNER_TEMP/gsip-app2b-evidence/ios/gsip-ios-parent-build-receipt.json" gsip-ios-build-receipt.json "$candidate_commit" "$RUNNER_TEMP/gsip-app2b-evidence/ios/gsip-ios-feature-comparison.json" "$RUNNER_TEMP/gsip-app2b-evidence/ios/gsip-ios-parent-native-audit.json" "$RUNNER_TEMP/gsip-app2b-evidence/ios/gsip-ios-candidate-native-audit.json" "$RUNNER_TEMP/gsip-ios-parent-repeat-reference.zip" "$RUNNER_TEMP/gsip-ios-reference.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: gsip-capture-ios-simulator
          path: |
            gsip-capture-ios-simulator.zip
            gsip-ios-build-receipt.json
            ${{ runner.temp }}/gsip-app2b-evidence/ios/**
          if-no-files-found: error
          retention-days: 14
