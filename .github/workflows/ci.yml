name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: '0.5.5'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --all-groups
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:map-budget
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=desktop-chrome
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: pnpm db:start
      - run: pnpm db:reset
      - run: pnpm db:test
      - if: always()
        run: pnpm db:stop
