name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: '0.5.5'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Install GDAL for the golden-tile tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --all-groups
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:map-budget
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=desktop-chrome
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
        env:
          GSIP_REQUIRE_GDAL: '1'
      - run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts
      - run: pnpm db:start
      - run: pnpm db:reset
      - run: pnpm db:test
      - if: always()
        run: pnpm db:stop
