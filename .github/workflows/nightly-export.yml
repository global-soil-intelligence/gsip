name: Nightly public dataset export

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: nightly-public-export
  cancel-in-progress: false

jobs:
  export:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.GSIP_EXPORT_SCHEDULE_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: '0.5.5'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run python -m pipeline.export --push
        env:
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
