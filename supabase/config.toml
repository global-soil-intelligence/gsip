project_id = "gsip"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55432
shadow_port = 55430
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/**"]
enable_anonymous_sign_ins = true

[storage]
enabled = true
file_size_limit = "12MiB"

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
